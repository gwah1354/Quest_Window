<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --fg-dim:rgba(255,255,255,0.55);
    --fg-faint:rgba(255,255,255,0.32);
    --accent:#5C8DF2;
    --accent-dim:rgba(92,141,242,0.16);
    --accent-line:rgba(92,141,242,0.4);
    --surface:rgba(255,255,255,0.04);
    --surface-border:rgba(255,255,255,0.09);
    --btn-bg:#ffffff;
    --btn-text:#0a0a0c;
    --ease-premium:cubic-bezier(0.22, 1, 0.36, 1);
    font-family:"Inter", sans-serif;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:"Inter", sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  #root{
    position:fixed;
    inset:0;
    overflow:hidden;
  }

  button, input, select, textarea{
    font-family:"Inter", sans-serif;
  }

  button{
    -webkit-appearance:none;
    appearance:none;
    background:none;
    border:none;
    color:inherit;
    cursor:pointer;
  }

  /* ---------- Night sky background ---------- */
  #sky{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .star{
    position:absolute;
    background:#ffffff;
    border-radius:50%;
    animation:twinkle linear infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:var(--min-op, 0.15); }
    50%{ opacity:var(--max-op, 0.9); }
  }
  .constellation{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    animation:drift 220s linear infinite alternate;
  }
  @keyframes drift{
    0%{ transform:translate(0,0); }
    100%{ transform:translate(-14px,10px); }
  }
  @media (prefers-reduced-motion: reduce){
    .star{ animation:none; opacity:0.5; }
    .constellation{ animation:none; }
  }

  /* ---------- Layout shells ---------- */
  .screen{
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:1;
    transform:scale(1);
    transition:opacity 0.55s var(--ease-premium), transform 0.55s var(--ease-premium);
  }
  .screen.hidden{
    opacity:0;
    transform:scale(0.985);
    pointer-events:none;
  }

  /* ---------- Screen 1: Create Quest ---------- */
  #setup-screen{
    justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .setup-inner{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:36px;
  }
  .field-label{
    font-size:15px;
    font-weight:600;
    color:var(--fg-dim);
    margin-bottom:14px;
    letter-spacing:0.01em;
  }
  #task-input{
    width:100%;
    min-height:110px;
    resize:none;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:16px;
    color:var(--fg);
    font-size:20px;
    font-weight:500;
    line-height:1.4;
    padding:18px 18px;
    outline:none;
    transition:border-color 0.35s var(--ease-premium), background 0.35s var(--ease-premium), box-shadow 0.35s var(--ease-premium);
  }
  #task-input::placeholder{
    color:var(--fg-faint);
    font-weight:500;
  }
  #task-input:focus{
    border-color:var(--accent-line);
    background:rgba(255,255,255,0.055);
    box-shadow:0 0 0 4px rgba(92,141,242,0.12);
  }

  /* Wheel picker */
  .wheel-wrap{
    position:relative;
    height:180px;
    border-radius:16px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    overflow:hidden;
  }
  .wheel-scroll{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:66px 0;
  }
  .wheel-scroll::-webkit-scrollbar{ display:none; }
  .wheel-item{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:center;
    font-size:20px;
    font-weight:600;
    color:var(--fg-faint);
    transform:scale(0.94);
    transition:color 0.25s var(--ease-premium), transform 0.25s var(--ease-premium), font-size 0.25s var(--ease-premium);
  }
  .wheel-item.selected{
    color:var(--fg);
    font-size:26px;
    font-weight:800;
    transform:scale(1);
  }
  .wheel-indicator{
    position:absolute;
    top:66px;
    left:0;
    right:0;
    height:48px;
    pointer-events:none;
    border-top:1px solid var(--surface-border);
    border-bottom:1px solid var(--surface-border);
  }
  .wheel-fade-top, .wheel-fade-bottom{
    position:absolute;
    left:0; right:0;
    height:66px;
    pointer-events:none;
    z-index:2;
  }
  .wheel-fade-top{
    top:0;
    background:linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
  }
  .wheel-fade-bottom{
    bottom:0;
    background:linear-gradient(to top, var(--bg) 0%, transparent 100%);
  }

  .btn-primary{
    width:100%;
    min-height:56px;
    border-radius:999px;
    background:var(--btn-bg);
    color:var(--btn-text);
    font-size:17px;
    font-weight:700;
    letter-spacing:0.01em;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.25s var(--ease-premium), transform 0.25s var(--ease-premium), box-shadow 0.25s var(--ease-premium);
  }
  .btn-primary:disabled{
    opacity:0.28;
    cursor:not-allowed;
  }

  /* ---------- Screen 2: Quest Mode ---------- */
  #quest-screen{
    justify-content:center;
    padding:40px;
  }
  #quest-text{
    font-weight:900;
    text-align:center;
    line-height:1.05;
    letter-spacing:-0.01em;
    color:var(--fg);
    max-width:100%;
    max-height:100%;
    overflow-wrap:break-word;
    word-break:break-word;
    user-select:none;
  }
  #quest-screen.dimmed #quest-text{
    opacity:0.35;
    transition:opacity 0.5s var(--ease-premium);
  }

  #show-timer-btn{
    position:absolute;
    right:20px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    min-height:44px;
    padding:0 18px;
    border-radius:999px;
    background:var(--btn-bg);
    color:var(--btn-text);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
    z-index:3;
    transition:opacity 0.3s var(--ease-premium), transform 0.25s var(--ease-premium), box-shadow 0.25s var(--ease-premium);
  }
  #show-timer-btn.hidden{ opacity:0; pointer-events:none; }

  #cancel-quest-btn{
    position:absolute;
    left:20px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    min-height:44px;
    padding:0 18px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.16);
    color:var(--fg);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
    z-index:3;
    backdrop-filter:blur(6px);
    transition:opacity 0.3s var(--ease-premium), transform 0.25s var(--ease-premium), background 0.25s var(--ease-premium);
  }
  #cancel-quest-btn.hidden{ opacity:0; pointer-events:none; }

  /* ---------- Timer panel ---------- */
  #timer-panel{
    position:absolute;
    right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    left:16px;
    max-width:340px;
    margin-left:auto;
    background:rgba(10,10,12,0.92);
    border:1px solid var(--surface-border);
    border-radius:20px;
    padding:20px 20px 16px;
    z-index:4;
    opacity:0;
    transform:translateY(12px);
    pointer-events:none;
    transition:opacity 0.4s var(--ease-premium), transform 0.4s var(--ease-premium);
    backdrop-filter:blur(6px);
  }
  #timer-panel.visible{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .battery{
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:14px;
  }
  .battery-body{
    position:relative;
    flex:1;
    height:36px;
    border:1.5px solid rgba(255,255,255,0.28);
    border-radius:10px;
    overflow:hidden;
    background:rgba(255,255,255,0.025);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.02);
    padding:3px;
  }
  .battery-fill{
    position:absolute;
    top:3px; left:3px; bottom:3px;
    width:calc(100% - 6px);
    border-radius:7px;
    background:linear-gradient(180deg, #ffffff, #dcdcdc);
    box-shadow:0 0 10px rgba(255,255,255,0.35);
    transition:width 1s linear;
  }
  .battery-terminal{
    width:5px;
    height:16px;
    background:rgba(255,255,255,0.28);
    border-radius:0 3px 3px 0;
  }
  .timer-remaining{
    text-align:center;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--fg-dim);
    margin-bottom:16px;
  }
  #hide-timer-btn{
    width:100%;
    min-height:44px;
    border-radius:999px;
    background:var(--btn-bg);
    color:var(--btn-text);
    font-size:14px;
    font-weight:700;
    transition:transform 0.25s var(--ease-premium), box-shadow 0.25s var(--ease-premium);
  }

  @media (prefers-reduced-motion: reduce){
    .battery-fill{ transition:none; }
  }

  /* ---------- Modal ---------- */
  #modal-overlay{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s var(--ease-premium), backdrop-filter 0.4s var(--ease-premium);
    padding:24px;
  }
  #modal-overlay.visible{
    opacity:1;
    pointer-events:auto;
  }
  .modal-card{
    width:100%;
    max-width:360px;
    background:#0a0a0c;
    border:1px solid var(--surface-border);
    border-radius:22px;
    padding:32px 26px 26px;
    text-align:center;
    transform:scale(0.92) translateY(10px);
    transition:transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #modal-overlay.visible .modal-card{ transform:scale(1) translateY(0); }
  .modal-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 24px;
  }
  .modal-buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn-modal{
    width:100%;
    min-height:58px;
    border-radius:999px;
    padding:0 28px;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:8px;
    margin:0 auto;
    transition:opacity 0.2s ease, box-shadow 0.25s ease, transform 0.25s var(--ease-premium);
    background:var(--btn-bg);
    color:var(--btn-text);
  }
  .modal-sub{
    font-size:15px;
    color:var(--fg-dim);
    margin:0 0 18px;
    font-weight:600;
  }
  .hidden-block{ display:none !important; }

  @keyframes btnBounce{
    0%{ transform:scale(1); }
    35%{ transform:scale(0.92); }
    60%{ transform:scale(1.045); }
    80%{ transform:scale(0.985); }
    100%{ transform:scale(1); }
  }
  button.btn-bounce{
    animation:btnBounce 0.42s cubic-bezier(0.33, 1, 0.68, 1);
  }
  @media (prefers-reduced-motion: reduce){
    button.btn-bounce{ animation:none; }
  }

  @media (hover:hover) and (pointer:fine){
    .btn-primary:not(:disabled):hover,
    #show-timer-btn:hover,
    #hide-timer-btn:hover,
    #cancel-quest-btn:hover,
    .btn-modal:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 22px rgba(255,255,255,0.14);
    }
  }
  .btn-primary:not(:disabled):active,
  #show-timer-btn:active,
  #hide-timer-btn:active,
  #cancel-quest-btn:active,
  .btn-modal:active{
    transform:scale(0.97);
  }
</style>
</head>
<body>
<div id="root">
  <div id="sky"></div>

  <!-- Screen 1: Create Quest -->
  <div id="setup-screen" class="screen">
    <div class="setup-inner">
      <div>
        <div class="field-label">What are you going to do?</div>
        <textarea id="task-input" placeholder="Finish Chapter 3 Notes..." maxlength="120"></textarea>
      </div>
      <div>
        <div class="field-label">How long?</div>
        <div class="wheel-wrap">
          <div class="wheel-fade-top"></div>
          <div class="wheel-fade-bottom"></div>
          <div class="wheel-indicator"></div>
          <div class="wheel-scroll" id="duration-wheel"></div>
        </div>
      </div>
      <button id="start-btn" class="btn-primary" disabled>Start Quest</button>
    </div>
  </div>

  <!-- Screen 2: Quest Mode -->
  <div id="quest-screen" class="screen hidden">
    <div id="quest-text"></div>
    <button id="cancel-quest-btn">Cancel Quest</button>
    <button id="show-timer-btn">Show Timer</button>
  </div>

  <!-- Timer panel -->
  <div id="timer-panel">
    <div class="battery">
      <div class="battery-body"><div class="battery-fill" id="battery-fill"></div></div>
      <div class="battery-terminal"></div>
    </div>
    <div class="timer-remaining" id="timer-remaining-text">25 min remaining</div>
    <button id="hide-timer-btn">Hide Timer</button>
  </div>

  <!-- Completion modal -->
  <div id="modal-overlay">
    <div class="modal-card">

      <div id="modal-complete-prompt">
        <div class="modal-title">Quest Complete?</div>
        <div class="modal-buttons">
          <button class="btn-modal btn-finished" id="finished-btn">Finished</button>
          <button class="btn-modal btn-extension" id="extension-btn">Need Extension</button>
        </div>
      </div>

      <div id="modal-finished-view" class="hidden-block">
        <div class="modal-title">  Quest Completed.</div>
        <button class="btn-modal btn-finished" id="next-quest-btn">Next Quest</button>
      </div>

      <div id="modal-extension-view" class="hidden-block">
        <div class="modal-title" style="margin-bottom:6px;">How many more minutes?</div>
        <div class="modal-sub">&nbsp;</div>
        <div class="wheel-wrap" style="height:170px; margin-bottom:20px;">
          <div class="wheel-fade-top"></div>
          <div class="wheel-fade-bottom"></div>
          <div class="wheel-indicator"></div>
          <div class="wheel-scroll" id="extension-wheel"></div>
        </div>
        <button class="btn-modal btn-finished" id="continue-quest-btn">Continue Quest</button>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "quest_state_v1";
  var ITEM_H = 48;

  // ---------- Elements ----------
  var setupScreen = document.getElementById("setup-screen");
  var questScreen = document.getElementById("quest-screen");
  var taskInput = document.getElementById("task-input");
  var startBtn = document.getElementById("start-btn");
  var questText = document.getElementById("quest-text");
  var showTimerBtn = document.getElementById("show-timer-btn");
  var cancelQuestBtn = document.getElementById("cancel-quest-btn");
  var timerPanel = document.getElementById("timer-panel");
  var hideTimerBtn = document.getElementById("hide-timer-btn");
  var batteryFill = document.getElementById("battery-fill");
  var timerRemainingText = document.getElementById("timer-remaining-text");
  var modalOverlay = document.getElementById("modal-overlay");
  var modalCompletePrompt = document.getElementById("modal-complete-prompt");
  var modalFinishedView = document.getElementById("modal-finished-view");
  var modalExtensionView = document.getElementById("modal-extension-view");
  var finishedBtn = document.getElementById("finished-btn");
  var extensionBtn = document.getElementById("extension-btn");
  var nextQuestBtn = document.getElementById("next-quest-btn");
  var continueQuestBtn = document.getElementById("continue-quest-btn");
  var durationWheelEl = document.getElementById("duration-wheel");
  var extensionWheelEl = document.getElementById("extension-wheel");

  // ---------- State ----------
  var state = {
    task: "",
    totalMs: 25 * 60 * 1000,
    endAt: null,        // timestamp when timer ends, null if not running
    remainingMsPaused: null, // used when we need a static remaining (e.g. before start)
    active: false,       // quest mode running (not yet completed)
    completed: false,
    extensionCount: 0,
    timerPanelVisible: false
  };

  var rafId = null;
  var duration = 25;
  var extMinutes = 10;

  // ---------- Night sky ----------
  function buildSky(){
    var sky = document.getElementById("sky");
    var frag = document.createDocumentFragment();
    var starCount = 55;
    for(var i=0;i<starCount;i++){
      var s = document.createElement("div");
      s.className = "star";
      var size = Math.random()*1.6 + 0.8;
      s.style.width = size+"px";
      s.style.height = size+"px";
      s.style.left = (Math.random()*100)+"%";
      s.style.top = (Math.random()*100)+"%";
      s.style.setProperty("--min-op", (0.1 + Math.random()*0.15).toFixed(2));
      s.style.setProperty("--max-op", (0.55 + Math.random()*0.4).toFixed(2));
      s.style.animationDuration = (3 + Math.random()*5).toFixed(1)+"s";
      s.style.animationDelay = (Math.random()*5).toFixed(1)+"s";
      frag.appendChild(s);
    }

    // a couple of faint constellations (svg line art) that drift very slowly
    var conNS = "http://www.w3.org/2000/svg";
    var positions = [
      [[10,15],[18,22],[27,18],[33,28]],
      [[68,70],[76,64],[84,72],[80,82]]
    ];
    positions.forEach(function(pts, idx){
      var svg = document.createElementNS(conNS,"svg");
      svg.setAttribute("class","constellation");
      svg.setAttribute("viewBox","0 0 100 100");
      svg.style.animationDelay = (idx*8)+"s";
      var poly = document.createElementNS(conNS,"polyline");
      poly.setAttribute("points", pts.map(function(p){return p[0]+","+p[1];}).join(" "));
      poly.setAttribute("fill","none");
      poly.setAttribute("stroke","rgba(255,255,255,0.14)");
      poly.setAttribute("stroke-width","0.15");
      svg.appendChild(poly);
      pts.forEach(function(p){
        var c = document.createElementNS(conNS,"circle");
        c.setAttribute("cx",p[0]); c.setAttribute("cy",p[1]); c.setAttribute("r","0.5");
        c.setAttribute("fill","rgba(255,255,255,0.5)");
        svg.appendChild(c);
      });
      frag.appendChild(svg);
    });

    sky.appendChild(frag);
  }

  // ---------- Wheel picker ----------
  function buildWheel(container, min, max, defaultVal, onChange){
    container.innerHTML = "";
    var items = [];
    for(var v=min; v<=max; v++){
      var el = document.createElement("div");
      el.className = "wheel-item";
      el.textContent = String(v);
      el.dataset.value = v;
      container.appendChild(el);
      items.push(el);
    }

    var settling = null;

    function selectByScroll(smooth){
      var idx = Math.round(container.scrollTop / ITEM_H);
      idx = Math.max(0, Math.min(items.length-1, idx));
      items.forEach(function(it,i){ it.classList.toggle("selected", i===idx); });
      var val = min + idx;
      onChange(val);
      return idx;
    }

    container.addEventListener("scroll", function(){
      selectByScroll();
      if(settling) clearTimeout(settling);
      settling = setTimeout(function(){
        selectByScroll();
      }, 120);
    }, { passive:true });

    // set default
    var defaultIdx = defaultVal - min;
    container.scrollTop = defaultIdx * ITEM_H;
    selectByScroll();

    return {
      setValue: function(v){
        var idx = Math.max(0, Math.min(items.length-1, v-min));
        container.scrollTop = idx * ITEM_H;
        selectByScroll();
      }
    };
  }

  var durationWheel = buildWheel(durationWheelEl, 1, 60, 25, function(v){ duration = v; });
  var extensionWheel = buildWheel(extensionWheelEl, 1, 60, 10, function(v){ extMinutes = v; });

  // ---------- Setup screen ----------
  function updateStartBtn(){
    startBtn.disabled = taskInput.value.trim().length === 0;
  }
  taskInput.addEventListener("input", updateStartBtn);

  function fitQuestText(){
    var text = questText.textContent;
    if(!text) return;
    var container = questScreen;
    var maxW = container.clientWidth - 80;
    var maxH = container.clientHeight - 140;
    var fontSize = Math.min(140, Math.max(28, 900 / Math.sqrt(text.length + 1) * 3));
    questText.style.fontSize = fontSize + "px";

    // shrink until it fits
    var guard = 0;
    while(guard < 60 && (questText.scrollWidth > maxW || questText.scrollHeight > maxH) && fontSize > 16){
      fontSize -= 4;
      questText.style.fontSize = fontSize + "px";
      guard++;
    }
    // grow a bit if there's plenty of room and text is short
    guard = 0;
    while(guard < 40 && questText.scrollWidth < maxW*0.72 && questText.scrollHeight < maxH*0.72 && fontSize < 220){
      fontSize += 4;
      questText.style.fontSize = fontSize + "px";
      guard++;
    }
  }
  window.addEventListener("resize", fitQuestText);

  function requestFullscreen(){
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(fn){
      try{ fn.call(el).catch(function(){}); }catch(e){}
    }
  }

  function startQuest(){
    state.task = taskInput.value.trim();
    state.totalMs = duration * 60 * 1000;
    state.endAt = Date.now() + state.totalMs;
    state.active = true;
    state.completed = false;
    state.extensionCount = 0;
    state.timerPanelVisible = false;
    persist();
    enterQuestMode();
  }

  startBtn.addEventListener("click", function(){
    if(startBtn.disabled) return;
    startQuest();
  });

  // ---------- Quest mode ----------
  function enterQuestMode(){
    questText.textContent = state.task;
    setupScreen.classList.add("hidden");
    questScreen.classList.remove("hidden");
    questScreen.classList.remove("dimmed");
    timerPanel.classList.remove("visible");
    showTimerBtn.classList.remove("hidden");
    modalOverlay.classList.remove("visible");
    requestFullscreen();
    requestAnimationFrame(fitQuestText);
    startTicking();
  }

  function backToSetup(){
    if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
    stopTicking();
    questScreen.classList.add("hidden");
    setupScreen.classList.remove("hidden");
    taskInput.value = "";
    updateStartBtn();
    modalOverlay.classList.remove("visible");
    questScreen.classList.remove("dimmed");
    timerPanel.classList.remove("visible");
  }

  cancelQuestBtn.addEventListener("click", function(){
    clearStorage();
    resetStateObj();
    backToSetup();
  });

  // ---------- Timer ticking ----------
  function startTicking(){
    stopTicking();
    tick();
  }
  function stopTicking(){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  var lastPersist = 0;

  function tick(){
    if(!state.active) return;
    var remaining = state.endAt - Date.now();
    if(remaining <= 0){
      remaining = 0;
      updateTimerUI(remaining);
      onQuestTimeUp();
      return;
    }
    updateTimerUI(remaining);

    var now = Date.now();
    if(now - lastPersist > 1000){
      persist();
      lastPersist = now;
    }
    rafId = requestAnimationFrame(tick);
  }

  function updateTimerUI(remainingMs){
    var pct = Math.max(0, Math.min(100, (remainingMs / state.totalMs) * 100));
    batteryFill.style.width = pct + "%";
    var totalSec = Math.ceil(remainingMs / 1000);
    var mins = Math.floor(totalSec / 60);
    var secs = totalSec % 60;
    var label;
    if(mins >= 1){
      label = mins + " min remaining";
    } else {
      label = pad2(mins) + ":" + pad2(secs) + " remaining";
    }
    timerRemainingText.textContent = label;
  }
  function pad2(n){ return (n<10? "0":"") + n; }

  showTimerBtn.addEventListener("click", function(){
    timerPanel.classList.add("visible");
    state.timerPanelVisible = true;
    persist();
  });
  hideTimerBtn.addEventListener("click", function(){
    timerPanel.classList.remove("visible");
    state.timerPanelVisible = false;
    persist();
  });

  // ---------- Completion ----------
  function onQuestTimeUp(){
    state.active = false;
    state.completed = true;
    persist();
    playPartyPopper();
    questScreen.classList.add("dimmed");
    showModal();
  }

  function showModal(){
    modalCompletePrompt.classList.remove("hidden-block");
    modalFinishedView.classList.add("hidden-block");
    modalExtensionView.classList.add("hidden-block");
    modalOverlay.classList.add("visible");
  }

  finishedBtn.addEventListener("click", function(){
    modalCompletePrompt.classList.add("hidden-block");
    modalFinishedView.classList.remove("hidden-block");
  });

  extensionBtn.addEventListener("click", function(){
    modalCompletePrompt.classList.add("hidden-block");
    modalExtensionView.classList.remove("hidden-block");
    extensionWheel.setValue(10);
  });

  nextQuestBtn.addEventListener("click", function(){
    clearStorage();
    resetStateObj();
    backToSetup();
  });

  continueQuestBtn.addEventListener("click", function(){
    var addMs = extMinutes * 60 * 1000;
    state.totalMs = state.totalMs + addMs; // battery reflects cumulative session
    state.endAt = Date.now() + addMs;
    state.totalMs = addMs; // battery represents the fresh extension window
    state.active = true;
    state.completed = false;
    state.extensionCount += 1;
    persist();
    modalOverlay.classList.remove("visible");
    questScreen.classList.remove("dimmed");
    startTicking();
  });

  function resetStateObj(){
    state = {
      task:"", totalMs: duration*60*1000, endAt:null, remainingMsPaused:null,
      active:false, completed:false, extensionCount:0, timerPanelVisible:false
    };
  }

  // ---------- Party popper sound (Web Audio synth, no external assets) ----------
  var audioCtx = null;
  function playPartyPopper(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
      var t0 = audioCtx.currentTime;

      // noise burst ("pop")
      var bufferSize = audioCtx.sampleRate * 0.25;
      var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var data = buffer.getChannelData(0);
      for(var i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
      }
      var noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      var noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.9, t0);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
      noise.connect(noiseGain).connect(audioCtx.destination);
      noise.start(t0);

      // bright confetti "sparkle" tones
      var freqs = [1400, 1800, 2200, 2800];
      freqs.forEach(function(f, idx){
        var osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, t0 + idx*0.03);
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t0 + idx*0.03);
        g.gain.exponentialRampToValueAtTime(0.22, t0 + idx*0.03 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + idx*0.03 + 0.4);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(t0 + idx*0.03);
        osc.stop(t0 + idx*0.03 + 0.45);
      });

      // low thump
      var thump = audioCtx.createOscillator();
      thump.type = "sine";
      thump.frequency.setValueAtTime(180, t0);
      thump.frequency.exponentialRampToValueAtTime(50, t0 + 0.15);
      var thumpGain = audioCtx.createGain();
      thumpGain.gain.setValueAtTime(0.6, t0);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
      thump.connect(thumpGain).connect(audioCtx.destination);
      thump.start(t0);
      thump.stop(t0 + 0.22);
    }catch(e){ /* audio not available, fail silently */ }
  }

  // unlock audio context on first user gesture
  document.addEventListener("click", function unlock(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
    document.removeEventListener("click", unlock);
  }, { once:true });

  // ---------- Persistence ----------
  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){}
  }
  function clearStorage(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }

  function restore(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return;
    var saved;
    try{ saved = JSON.parse(raw); }catch(e){ return; }
    if(!saved || !saved.task) return;

    state = saved;

    if(state.active && state.endAt){
      var remaining = state.endAt - Date.now();
      if(remaining <= 0){
        // finished while away
        state.active = false;
        state.completed = true;
        questText.textContent = state.task;
        setupScreen.classList.add("hidden");
        questScreen.classList.remove("hidden");
        requestAnimationFrame(fitQuestText);
        questScreen.classList.add("dimmed");
        showModal();
        return;
      }
      enterQuestMode();
      if(state.timerPanelVisible){
        timerPanel.classList.add("visible");
      }
    } else if(state.completed){
      questText.textContent = state.task;
      setupScreen.classList.add("hidden");
      questScreen.classList.remove("hidden");
      requestAnimationFrame(fitQuestText);
      questScreen.classList.add("dimmed");
      showModal();
    }
  }

  // ---------- Button click bounce ----------
  function attachBounce(){
    document.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        btn.classList.remove("btn-bounce");
        // force reflow so the animation can retrigger
        void btn.offsetWidth;
        btn.classList.add("btn-bounce");
      });
      btn.addEventListener("animationend", function(){
        btn.classList.remove("btn-bounce");
      });
    });
  }

  // ---------- Init ----------
  buildSky();
  attachBounce();
  updateStartBtn();
  restore();

})();
</script>
</body>
</html>
